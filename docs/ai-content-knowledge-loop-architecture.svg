    <path d="M510 348C606 234 770 182 960 182C1156 182 1322 238 1416 360" stroke="#1688C8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1458 470C1482 612 1420 746 1292 824" stroke="#1688C8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1110 894C892 948 642 884 524 718" stroke="#1688C8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M462 622C428 520 444 430 510 348" stroke="#1688C8" stroke-width="4" marker-end="url(#arrow)"/>
  </g>

  <g class="ui">
