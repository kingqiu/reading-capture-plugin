    <text x="1310" y="282" class="loopLabel">02 ENRICH</text>
    <text x="1344" y="790" class="loopLabel">03 DISTILL</text>
    <text x="624" y="896" class="loopLabel">04 PUBLISH & FEEDBACK</text>
