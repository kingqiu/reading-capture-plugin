    <rect x="139" y="126" width="36" height="36" fill="#DFF3FF" stroke="#A6D7F4" stroke-width="2"/>
    <path d="M1608 78L1690 34L1738 138L1664 190L1608 78Z" stroke="#94CEF0"/>
    <path d="M1608 78L1664 190M1690 34L1664 190M1738 138L1608 78" stroke="#94CEF0"/>
    <circle cx="1608" cy="78" r="5" fill="#62B8E8"/>
    <circle cx="1690" cy="34" r="5" fill="#62B8E8"/>
    <circle cx="1738" cy="138" r="5" fill="#62B8E8"/>
    <circle cx="1664" cy="190" r="12" fill="#E5F7FF" stroke="#58B8EA" stroke-width="4"/>
    <path d="M74 880C166 828 250 840 330 920" stroke="#AADBF3"/>
    <circle cx="74" cy="880" r="10" fill="#E5F7FF" stroke="#58B8EA" stroke-width="3"/>
    <circle cx="330" cy="920" r="10" fill="#E5F7FF" stroke="#58B8EA" stroke-width="3"/>
    <path d="M64 766H112M54 786H132M74 806H124" stroke="#60B9E9" stroke-width="5" stroke-linecap="round"/>
    <path d="M1768 740H1812M1784 760H1830M1768 780H1804" stroke="#60B9E9" stroke-width="5" stroke-linecap="round"/>
