<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FCFF"/>
      <stop offset="0.54" stop-color="#EEF8FF"/>
      <stop offset="1" stop-color="#E7F5FF"/>
    </linearGradient>
    <linearGradient id="titleBox" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EAF8FF"/>
      <stop offset="1" stop-color="#D4EEFF"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E9F8FF"/>
      <stop offset="1" stop-color="#CDEBFF"/>
    </linearGradient>
    <linearGradient id="blueDeep" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3D9CE0"/>
      <stop offset="1" stop-color="#0F4F8E"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#DFF6FF"/>
      <stop offset="1" stop-color="#B9E5FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B5F9F" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B5F9F" flood-opacity="0.12"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#1688C8"/>
    </marker>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#FFFFFF"/>
    </marker>
    <style>
      .ui { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .title { fill:#06203A; font-size:42px; font-weight:900; letter-spacing:.5px; }
      .subtitle { fill:#143B5B; font-size:22px; font-weight:700; }
      .sectionTitle { fill:#FFFFFF; font-size:25px; font-weight:900; letter-spacing:.3px; }
      .cardTitle { fill:#073154; font-size:24px; font-weight:900; }
      .cardSub { fill:#174767; font-size:17px; font-weight:650; }
      .small { fill:#255A78; font-size:15px; font-weight:650; }
      .centerTitle { fill:#06203A; font-size:34px; font-weight:950; }
      .centerSub { fill:#164462; font-size:18px; font-weight:750; }
      .layer { fill:#083456; font-size:20px; font-weight:850; }
      .loopLabel { fill:#0A5D94; font-size:18px; font-weight:900; letter-spacing:.8px; }
