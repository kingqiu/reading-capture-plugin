    <text x="960" y="889" text-anchor="middle" class="cardSub">OpenClaw 等：补充、改写、结构化、扩展</text>
  </g>
  <path d="M960 254V300" stroke="#1688C8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M960 826V770" stroke="#1688C8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Codex -->
  <g class="ui" filter="url(#shadow)">
    <rect x="1322" y="438" width="300" height="204" rx="30" fill="url(#blueDeep)" stroke="#0C4D83" stroke-width="2"/>
    <text x="1472" y="516" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="950">Codex</text>
    <text x="1472" y="556" text-anchor="middle" fill="#E9F8FF" font-size="21" font-weight="800">提炼 / 二创</text>
    <text x="1472" y="586" text-anchor="middle" fill="#E9F8FF" font-size="21" font-weight="800">智能内容生成</text>
