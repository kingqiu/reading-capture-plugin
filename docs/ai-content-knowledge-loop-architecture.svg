  <g stroke="#1688C8" stroke-width="4" marker-end="url(#arrow)">
    <path d="M1622 482C1656 430 1664 346 1688 310"/>
    <path d="M1622 540H1688"/>
    <path d="M1622 598C1656 650 1664 734 1688 770"/>
  </g>

  <!-- Feedback loop from outputs to Obsidian -->
  <path d="M1791 822C1730 970 1366 1018 960 1018C560 1018 278 936 278 744" stroke="#1FA0DD" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
  <text x="960" y="1000" text-anchor="middle" class="ui" fill="#0A5D94" font-size="19" font-weight="900">发布反馈 / 新灵感 / 选题回流 → Obsidian</text>

  <!-- Bottom caption aligned with center -->
  <g class="ui">
    <rect x="720" y="962" width="480" height="44" rx="22" fill="#FFFFFF" stroke="#9DD5F2"/>
    <text x="960" y="991" text-anchor="middle" fill="#174767" font-size="18" font-weight="900">Capture → Enrich → Distill → Publish → Feedback</text>
  </g>
</svg>
