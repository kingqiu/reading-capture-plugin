    <text x="277" y="422" text-anchor="middle" class="cardTitle">Hermes</text>
    <text x="277" y="450" text-anchor="middle" class="cardSub">移动端资料汇总</text>

    <rect x="118" y="518" width="318" height="90" rx="18" fill="url(#blueCard)" stroke="#73BFEA" stroke-width="2"/>
    <text x="277" y="558" text-anchor="middle" class="cardTitle">Web Clipper</text>
    <text x="277" y="586" text-anchor="middle" class="cardSub">PC Browser 网页文章采集</text>

    <rect x="118" y="654" width="318" height="90" rx="18" fill="#FFFFFF" stroke="#A7D8F2" stroke-width="2" stroke-dasharray="9 8"/>
    <text x="277" y="694" text-anchor="middle" class="cardTitle">未来入口</text>
    <text x="277" y="722" text-anchor="middle" class="cardSub">视频 / 音频 / 文档</text>
  </g>

  <g stroke="#1688C8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M436 291C540 304 606 344 690 412"/>
    <path d="M436 427C544 438 612 462 690 514"/>
    <path d="M436 563C544 560 612 576 690 612"/>
    <path d="M436 699C548 686 612 672 690 682"/>
