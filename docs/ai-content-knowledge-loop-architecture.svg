    <rect x="760" y="510" width="400" height="56" rx="14" fill="#FFFFFF" stroke="#8CCCEB"/>
    <text x="960" y="546" text-anchor="middle" class="layer">原始资料</text>
    <rect x="760" y="586" width="400" height="56" rx="14" fill="#FFFFFF" stroke="#8CCCEB"/>
    <text x="960" y="622" text-anchor="middle" class="layer">知见录 / 阅读标注</text>
    <rect x="760" y="662" width="400" height="56" rx="14" fill="#FFFFFF" stroke="#8CCCEB"/>
    <text x="960" y="698" text-anchor="middle" class="layer">知识沉淀</text>
  </g>

