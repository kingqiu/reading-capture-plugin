  <path d="M1230 540H1322" stroke="#0B5F9F" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1322 590H1230" stroke="#0B5F9F" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1276" y="522" text-anchor="middle" class="ui" fill="#0A5D94" font-size="17" font-weight="900">提炼 ↔ 二创</text>

  <!-- Outputs -->
  <g class="ui" filter="url(#shadow)">
    <rect x="1688" y="258" width="206" height="104" rx="20" fill="#FFFFFF" stroke="#79C5EB" stroke-width="2"/>
    <text x="1791" y="304" text-anchor="middle" class="cardTitle">长文章</text>
    <text x="1791" y="334" text-anchor="middle" class="cardSub">公众号 / 播客文章</text>

    <rect x="1688" y="488" width="206" height="104" rx="20" fill="#FFFFFF" stroke="#79C5EB" stroke-width="2"/>
    <text x="1791" y="534" text-anchor="middle" class="cardTitle">图文内容</text>
    <text x="1791" y="564" text-anchor="middle" class="cardSub">小红书卡片 + 文案</text>

    <rect x="1688" y="718" width="206" height="104" rx="20" fill="#FFFFFF" stroke="#79C5EB" stroke-width="2"/>
    <text x="1791" y="764" text-anchor="middle" class="cardTitle">视频内容</text>
    <text x="1791" y="794" text-anchor="middle" class="cardSub">视频号 / 抖音</text>
