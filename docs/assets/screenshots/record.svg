<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-label="Reading Capture reading record demo screenshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07100b"/><stop offset="1" stop-color="#050806"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .ui { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .title { fill:#f2efe4; font-size:32px; font-weight:850; }
      .h2 { fill:#f2efe4; font-size:28px; font-weight:850; }
      .text { fill:#dfe5d9; font-size:18px; }
      .muted { fill:#90a091; font-size:15px; }
      .label { fill:#8ea091; font-size:14px; font-weight:800; letter-spacing:.05em; }
      .button { fill:#f3f5ec; font-size:16px; font-weight:800; }
      .chip { fill:#cfd8cf; font-size:14px; font-weight:800; }
      .panel { fill:#08100b; stroke:#243527; stroke-width:1.3; }
    </style>
  </defs>
  <rect width="1600" height="960" fill="#111"/>
  <rect x="18" y="18" width="1564" height="924" rx="20" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="18" y="18" width="1564" height="44" rx="20" fill="#242625"/>
  <circle cx="42" cy="40" r="7" fill="#ff6b5f"/><circle cx="64" cy="40" r="7" fill="#f6c351"/><circle cx="86" cy="40" r="7" fill="#55c36a"/>
  <rect x="114" y="16" width="190" height="48" rx="10" fill="#121816" stroke="#334039"/><text class="ui text" x="146" y="46">阅读记录</text>
  <rect x="18" y="62" width="48" height="880" fill="#151a18"/>
  <text class="ui muted" x="35" y="112" text-anchor="middle">↩</text><text class="ui muted" x="35" y="158" text-anchor="middle">⌕</text><text class="ui muted" x="35" y="204" text-anchor="middle">▧</text><text class="ui muted" x="35" y="250" text-anchor="middle">☷</text>

  <rect x="66" y="72" width="1516" height="104" fill="#07100b" stroke="#203126"/>
  <text class="ui label" x="112" y="112">READING RECORD</text>
  <text class="ui title" x="112" y="146">Building Better Reading Habits</text>
  <text class="ui muted" x="112" y="170">demo/articles/reading-habits/article_zh_enriched.md</text>
  <rect x="946" y="104" width="116" height="42" rx="9" fill="#1a2b1e" stroke="#507655"/><text class="ui button" x="1004" y="131" text-anchor="middle">记录视图</text>
  <rect x="1074" y="104" width="116" height="42" rx="9" fill="#0d1711" stroke="#2b3b2f"/><text class="ui button" x="1132" y="131" text-anchor="middle">Markdown</text>
  <rect x="1216" y="104" width="106" height="42" rx="9" fill="#0d1711" stroke="#2b3b2f"/><text class="ui button" x="1269" y="131" text-anchor="middle">回到原文</text>
  <rect x="1336" y="104" width="106" height="42" rx="9" fill="#0d1711" stroke="#2b3b2f"/><text class="ui button" x="1389" y="131" text-anchor="middle">复制路径</text>
  <rect x="1456" y="104" width="42" height="42" rx="9" fill="#0d1711" stroke="#2b3b2f"/><text class="ui button" x="1477" y="131" text-anchor="middle">...</text>

  <rect x="66" y="176" width="760" height="728" fill="#07100b" stroke="#203126"/>
  <text class="ui h2" x="112" y="236">阅读沉淀</text>
  <text class="ui muted" x="112" y="264">5 条记录 · 2 个创作灵感 · 1 个待核查</text>
  <rect x="112" y="302" width="62" height="36" rx="9" fill="#18203a" stroke="#4f7cff"/><text class="ui chip" x="129" y="325">全部</text>
  <rect x="188" y="302" width="100" height="36" rx="9" fill="#101912" stroke="#29392d"/><text class="ui chip" x="207" y="325">创作灵感 2</text>
  <rect x="302" y="302" width="88" height="36" rx="9" fill="#101912" stroke="#29392d"/><text class="ui chip" x="320" y="325">待核查 1</text>
  <rect x="404" y="302" width="86" height="36" rx="9" fill="#101912" stroke="#29392d"/><text class="ui chip" x="422" y="325">想法 2</text>

  <text class="ui" x="112" y="386" fill="#58d06f" font-size="18" font-weight="800">● 创作灵感 2</text>
  <g transform="translate(112 414)">
    <rect width="640" height="110" rx="12" fill="#0c1610" stroke="#56c46f"/>
    <rect x="18" y="18" width="82" height="26" rx="7" fill="#17371d"/><text class="ui chip" x="30" y="36" fill="#8eea95">创作灵感</text>
    <text class="ui muted" x="114" y="36">10:31</text>
    <text class="ui text" x="18" y="70">把阅读变成稳定创作系统，而不是收藏系统。</text>
    <text class="ui muted" x="18" y="96">适合写成一篇给创作者的工作流文章。</text>
  </g>
  <text class="ui" x="112" y="568" fill="#ffa83a" font-size="18" font-weight="800">● 事实待核查 1</text>
  <g transform="translate(112 596)">
    <rect width="640" height="118" rx="12" fill="#0c1610" stroke="#f0a33a"/>
    <rect x="18" y="18" width="82" height="26" rx="7" fill="#352411"/><text class="ui chip" x="30" y="36" fill="#ffc46b">事实待核查</text>
    <text class="ui muted" x="114" y="36">09:42</text>
    <text class="ui text" x="18" y="72">“Most saved articles are never revisited.”</text>
    <text class="ui muted" x="18" y="100">需要找一组公开数据作为支撑。</text>
  </g>
  <text class="ui" x="112" y="758" fill="#5e83ff" font-size="18" font-weight="800">● 标注想法 2</text>

  <rect x="826" y="176" width="756" height="728" fill="#07100b" stroke="#203126"/>
  <text class="ui h2" x="882" y="236">当前记录</text>
  <rect x="1048" y="210" width="82" height="28" rx="7" fill="#17371d"/><text class="ui chip" x="1062" y="229" fill="#8eea95">创作灵感</text>
  <text class="ui muted" x="1144" y="230">10:31</text>
  <text class="ui label" x="882" y="292">原文引用</text>
  <rect x="882" y="314" width="600" height="116" rx="10" fill="#0c1610" stroke="#2b3b2f"/>
  <rect x="904" y="334" width="3" height="76" fill="#4f7cff"/>
  <text class="ui text" x="924" y="358">“Save the idea while it still has heat.”</text>
  <text class="ui muted" x="924" y="392">A note is useful only if it can be found again.</text>
  <text class="ui label" x="882" y="484">我的想法</text>
  <rect x="882" y="506" width="600" height="136" rx="10" fill="#0c1610" stroke="#2b3b2f"/>
  <text class="ui text" x="906" y="546">把阅读变成稳定创作系统，而不是收藏系统。</text>
  <text class="ui muted" x="906" y="586">可以从“收藏焦虑”切入，再讲如何把标注转成灵感。</text>
  <text class="ui label" x="882" y="694">动作</text>
  <rect x="882" y="716" width="280" height="50" rx="10" fill="#315dba"/><text class="ui button" x="1022" y="747" text-anchor="middle">回到原文位置</text>
  <rect x="1180" y="716" width="280" height="50" rx="10" fill="#0d1711" stroke="#2b3b2f"/><text class="ui button" x="1320" y="747" text-anchor="middle">复制引用</text>
  <rect x="882" y="782" width="280" height="50" rx="10" fill="#0d1711" stroke="#2b3b2f"/><text class="ui button" x="1022" y="813" text-anchor="middle">复制想法</text>
  <rect x="1180" y="782" width="280" height="50" rx="10" fill="#0d1711" stroke="#2b3b2f"/><text class="ui button" x="1320" y="813" text-anchor="middle">打开原始 Markdown</text>
</svg>
