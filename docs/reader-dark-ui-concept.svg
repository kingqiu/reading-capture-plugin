<svg width="1920" height="1200" viewBox="0 0 1920 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="readerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="36" flood-color="#000000" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#FFFFFF" flood-opacity="0.04"/>
    </filter>
    <filter id="noteShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="appBg" x1="0" y1="0" x2="1920" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060806"/>
      <stop offset="0.48" stop-color="#101610"/>
      <stop offset="1" stop-color="#192318"/>
    </linearGradient>
    <linearGradient id="articleBg" x1="0" y1="0" x2="900" y2="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171C18"/>
      <stop offset="1" stop-color="#101410"/>
    </linearGradient>
    <radialGradient id="softGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1110 80) rotate(118) scale(860 520)">
      <stop offset="0" stop-color="#536A52" stop-opacity="0.34"/>
      <stop offset="0.62" stop-color="#1F2B20" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#080B09" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M2 2H3V3H2V2ZM9 5H10V6H9V5ZM5 10H6V11H5V10Z" fill="#FFFFFF" fill-opacity="0.028"/>
    </pattern>
    <style>
      .ui { font-family: "PingFang SC", "Songti SC", "Noto Serif SC", sans-serif; }
      .serif { font-family: "Songti SC", "Noto Serif SC", Georgia, serif; }
      .kicker { fill:#758173; font-size:12px; font-weight:850; letter-spacing:1.6px; }
      .title { fill:#F1EFE5; font-size:20px; font-weight:850; }
      .articleTitle { fill:#F3F0E8; font-size:42px; font-weight:860; }
      .articleMeta { fill:#9AA496; font-size:17px; font-weight:650; }
      .body { fill:#D8DDD4; font-size:21px; font-weight:520; }
      .bodyMuted { fill:#A7AEA4; font-size:18px; font-weight:560; }
      .heading { fill:#F0EDE2; font-size:31px; font-weight:850; }
      .noteTitle { fill:#F0EEE4; font-size:20px; font-weight:850; }
      .noteText { fill:#C5CBC2; font-size:14px; font-weight:570; }
      .chip { fill:#B8C0B6; font-size:12px; font-weight:800; }
    </style>
  </defs>

  <rect width="1920" height="1200" fill="#050605"/>
  <rect x="42" y="40" width="1836" height="1120" rx="18" fill="url(#appBg)" stroke="#202821"/>
  <rect x="42" y="40" width="1836" height="1120" rx="18" fill="url(#softGlow)"/>
  <rect x="42" y="40" width="1836" height="1120" rx="18" fill="url(#grain)"/>

  <rect x="42" y="40" width="1836" height="46" rx="18" fill="#0B0D0B"/>
  <circle cx="70" cy="63" r="7" fill="#FF5F57"/>
  <circle cx="94" cy="63" r="7" fill="#FFBD2E"/>
  <circle cx="118" cy="63" r="7" fill="#28C840"/>
  <text x="910" y="70" class="ui" fill="#DDE2D8" font-size="14" font-weight="800">Reading Capture Reader</text>

  <!-- Left navigation rail in Obsidian -->
  <rect x="42" y="86" width="76" height="1074" fill="#0C0E0C"/>
  <line x1="118" y1="86" x2="118" y2="1160" stroke="#202720"/>
  <g opacity="0.85">
    <rect x="66" y="126" width="28" height="28" rx="7" fill="#1B211B"/>
    <rect x="66" y="188" width="28" height="28" rx="7" fill="#1B211B"/>
    <rect x="66" y="250" width="28" height="28" rx="7" fill="#536A52"/>
    <rect x="66" y="312" width="28" height="28" rx="7" fill="#1B211B"/>
    <rect x="66" y="374" width="28" height="28" rx="7" fill="#1B211B"/>
  </g>

  <!-- Reader toolbar -->
  <g class="ui">
    <rect x="142" y="104" width="1708" height="68" rx="15" fill="#101510" stroke="#263026" filter="url(#noteShadow)"/>
    <text x="174" y="132" class="kicker">READING CAPTURE</text>
    <text x="174" y="156" class="title">article_zh_enriched</text>
    <rect x="1306" y="119" width="112" height="38" rx="10" fill="#151B16" stroke="#303A30"/>
    <text x="1332" y="143" fill="#D8DDD4" font-size="14" font-weight="800">记录想法</text>
    <rect x="1430" y="119" width="138" height="38" rx="10" fill="#536A52"/>
    <text x="1454" y="143" fill="#F4F6EE" font-size="14" font-weight="850">记录选中内容</text>
    <rect x="1580" y="119" width="110" height="38" rx="10" fill="#151B16" stroke="#303A30"/>
    <text x="1607" y="143" fill="#D8DDD4" font-size="14" font-weight="800">隐藏标注</text>
    <rect x="1702" y="119" width="112" height="38" rx="10" fill="#151B16" stroke="#303A30"/>
    <text x="1728" y="143" fill="#D8DDD4" font-size="14" font-weight="800">返回资料库</text>
  </g>

  <!-- Article panel -->
  <g filter="url(#readerShadow)">
    <rect x="250" y="212" width="1044" height="878" rx="18" fill="url(#articleBg)" stroke="#2E382E"/>
    <rect x="250" y="212" width="1044" height="878" rx="18" fill="url(#grain)" opacity="0.6"/>
  </g>

  <g class="ui">
    <text x="350" y="304" class="articleTitle">WTF 是一个 Loop?</text>
    <text x="350" y="356" class="articleMeta">Peter Steinberger vs. Boris Cherny · 2026-06-08 · 原文翻译 + 增强解读</text>
    <line x1="350" y1="400" x2="1194" y2="400" stroke="#303A30"/>

    <text x="350" y="472" class="heading">统计数据</text>
    <text x="376" y="528" class="body">回复：74</text>
    <text x="376" y="578" class="body">点赞：1,583</text>
    <text x="376" y="628" class="body">浏览：153,599</text>

    <rect x="350" y="690" width="760" height="212" rx="14" fill="#090B09" stroke="#2E382E"/>
    <text x="390" y="750" fill="#D6BA57" font-size="28" font-weight="850">“You shouldn't be prompting coding agents</text>
    <text x="390" y="792" fill="#D6BA57" font-size="28" font-weight="850">anymore. You should be designing loops</text>
    <text x="390" y="834" fill="#D6BA57" font-size="28" font-weight="850">that prompt your agents.”</text>
    <text x="390" y="872" fill="#9AA496" font-size="14" font-weight="750">@steipete · 2.2M views</text>

    <line x1="350" y1="950" x2="1194" y2="950" stroke="#303A30"/>
    <text x="350" y="1012" class="heading">简介</text>
    <text x="350" y="1064" class="body">本周 AI 编码领域被重复最多的一句话只有六个字，但几乎没有人能定义它。</text>
  </g>

  <!-- Highlight example -->
  <g class="ui">
    <rect x="350" y="552" width="224" height="34" rx="6" fill="#D6BA57" fill-opacity="0.3" stroke="#D6BA57" stroke-opacity="0.36"/>
    <rect x="614" y="1068" width="470" height="32" rx="6" fill="#536A52" fill-opacity="0.36" stroke="#81A279" stroke-opacity="0.45"/>
  </g>

  <!-- Sidebar notes -->
  <g class="ui" filter="url(#noteShadow)">
    <rect x="1324" y="212" width="402" height="878" rx="18" fill="#101510" stroke="#2E382E"/>
    <text x="1352" y="254" class="kicker">NOTES</text>
    <text x="1352" y="286" class="noteTitle">阅读标注</text>
    <text x="1444" y="286" fill="#7E887D" font-size="14" font-weight="750">5 条记录</text>
    <rect x="1352" y="318" width="54" height="28" rx="9" fill="#F7F0D2" fill-opacity="0.1" stroke="#D6BA57" stroke-opacity="0.28"/>
    <text x="1367" y="337" class="chip">全部</text>
    <rect x="1414" y="318" width="54" height="28" rx="9" fill="#151B16" stroke="#303A30"/>
    <text x="1429" y="337" class="chip">想法</text>
    <rect x="1476" y="318" width="54" height="28" rx="9" fill="#151B16" stroke="#303A30"/>
    <text x="1491" y="337" class="chip">图片</text>
    <rect x="1538" y="318" width="66" height="28" rx="9" fill="#151B16" stroke="#303A30"/>
    <text x="1553" y="337" class="chip">待核查</text>

    <rect x="1352" y="380" width="346" height="148" rx="13" fill="#171D18" stroke="#313B31"/>
    <rect x="1372" y="400" width="68" height="24" rx="8" fill="#D6BA57" fill-opacity="0.2"/>
    <text x="1385" y="417" fill="#D6BA57" font-size="12" font-weight="850">标注想法</text>
    <text x="1648" y="418" fill="#7E887D" font-size="12" font-weight="800">12:02</text>
    <text x="1372" y="454" class="noteText">Peter Steinberger 在 6 月 7 日发了这条推文，</text>
    <text x="1372" y="478" class="noteText">它突破了 220 万次浏览，评论区变成了...</text>
    <text x="1372" y="508" fill="#ECEBE2" font-size="14" font-weight="700">这是关于 Loop Engineering 最早引发讨论...</text>

    <rect x="1352" y="552" width="346" height="148" rx="13" fill="#171D18" stroke="#313B31"/>
    <rect x="1372" y="572" width="68" height="24" rx="8" fill="#5267FF" fill-opacity="0.2"/>
    <text x="1385" y="589" fill="#8FA0FF" font-size="12" font-weight="850">图片想法</text>
    <text x="1648" y="590" fill="#7E887D" font-size="12" font-weight="800">12:24</text>
    <text x="1372" y="626" class="noteText">这张图适合作为公众号文章中的结构图。</text>
    <text x="1372" y="650" class="noteText">后续可以改写成更适合中文读者的版本...</text>

    <rect x="1352" y="724" width="346" height="148" rx="13" fill="#171D18" stroke="#4F3D42"/>
    <rect x="1372" y="744" width="76" height="24" rx="8" fill="#E044A7" fill-opacity="0.16"/>
    <text x="1385" y="761" fill="#F071C1" font-size="12" font-weight="850">事实待核查</text>
    <text x="1648" y="762" fill="#7E887D" font-size="12" font-weight="800">14:18</text>
    <text x="1372" y="798" class="noteText">第一阶段是学术 while-loop 的说法，</text>
    <text x="1372" y="822" class="noteText">需要核对 ReAct 原论文和后续引用链...</text>
    <text x="1372" y="852" fill="#ECEBE2" font-size="14" font-weight="700">这里适合放到文章事实核查清单里。</text>
  </g>

  <!-- Floating note -->
  <g class="ui" filter="url(#noteShadow)">
    <rect x="770" y="524" width="310" height="118" rx="13" fill="#111611" stroke="#D6BA57" stroke-opacity="0.45"/>
    <text x="792" y="554" fill="#D6BA57" font-size="12" font-weight="850">标注想法</text>
    <text x="792" y="586" fill="#D8DDD4" font-size="14" font-weight="650">这段数据可以用来说明 Loop 话题不是</text>
    <text x="792" y="610" fill="#D8DDD4" font-size="14" font-weight="650">小圈子自嗨，而是已经形成传播势能。</text>
  </g>
</svg>
